{{ define "content" }}
<main class="flex-1 overflow-y-auto px-8 pb-10 pt-2">
  <!-- Module Header with Title and Back Action -->
  <div class="flex items-center justify-between mb-5">
    <h2 class="text-2xl font-black text-gray-900 tracking-tight">Tambah Obat</h2>
    <a class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-gray-50 border border-gray-200 text-xs font-bold text-gray-700 rounded-xl shadow-xs transition" href="/datamaster/dataobat">
      <i class="fa-solid fa-chevron-left text-[11px]"></i>
      <span>Kembali ke Daftar Obat</span>
    </a>
  </div>

  <!-- Main Form Container Card -->
  <div class="bg-white rounded-2xl shadow-sm border border-orange-100 p-8">
    <form class="space-y-8" id="tambahObatForm" onsubmit="event.preventDefault(); submitForm();">
      <!-- SECTION A: IDENTITAS OBAT -->
      <section data-purpose="form-section-a">
        <div class="flex items-center gap-2.5 mb-5">
          <span class="w-6 h-6 rounded-md bg-orange-100/90 text-brand-terracotta text-xs font-bold flex items-center justify-center">A</span>
          <h3 class="text-sm font-bold text-gray-900">Identitas Obat</h3>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5" for="kodeObat">
              Kode Obat <span class="text-red-500 font-semibold">*</span>
            </label>
            <div class="relative flex items-center">
              <input class="form-input-custom w-full text-xs font-medium text-gray-800 border-gray-300 rounded-lg pr-28 pl-3.5 py-2.5 focus:border-brand-terracotta focus:ring-brand-terracotta" id="kodeObat" required="" type="text" value="MED-PCT-06"/>
              <button class="absolute right-2 px-2.5 py-1 text-[11px] font-bold text-brand-terracotta border border-brand-terracotta/80 rounded-md hover:bg-orange-50 active:scale-95 transition" onclick="generateRandomCode()" type="button">
                Auto-generate
              </button>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5" for="namaObat">
              Nama Obat <span class="text-red-500 font-semibold">*</span>
            </label>
            <input class="form-input-custom w-full text-xs font-medium text-gray-800 border-gray-300 rounded-lg px-3.5 py-2.5 focus:border-brand-terracotta focus:ring-brand-terracotta" id="namaObat" required="" type="text" value="Paracetamol Drop 15ml"/>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5" for="kategoriObat">
              Kategori Obat <span class="text-red-500 font-semibold">*</span>
            </label>
            <div class="relative">
              <select class="form-input-custom w-full text-xs font-medium text-gray-800 border-gray-300 rounded-lg px-3.5 py-2.5 appearance-none focus:border-brand-terracotta focus:ring-brand-terracotta pr-10 cursor-pointer" id="kategoriObat">
                <option selected="" value="Obat Bebas">Obat Bebas</option>
                <option value="Obat Bebas Terbatas">Obat Bebas Terbatas</option>
                <option value="Obat Keras">Obat Keras</option>
                <option value="Narkotika">Narkotika</option>
                <option value="Psikotropika">Psikotropika</option>
              </select>
              <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                <i class="fa-solid fa-chevron-down text-[10px]"></i>
              </span>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5" for="jenisObat">
              Jenis Obat <span class="text-red-500 font-semibold">*</span>
            </label>
            <div class="relative">
              <select class="form-input-custom w-full text-xs font-medium text-gray-800 border-gray-300 rounded-lg px-3.5 py-2.5 appearance-none focus:border-brand-terracotta focus:ring-brand-terracotta pr-10 cursor-pointer" id="jenisObat">
                <option selected="" value="Generik">Generik</option>
                <option value="Paten / Branded">Paten / Branded</option>
                <option value="Herbal">Herbal</option>
                <option value="Alkes">Alat Kesehatan</option>
              </select>
              <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                <i class="fa-solid fa-chevron-down text-[10px]"></i>
              </span>
            </div>
          </div>
        </div>
      </section>

      <!-- SECTION B: INFORMASI OBAT -->
      <section data-purpose="form-section-b">
        <div class="flex items-center gap-2.5 mb-5">
          <span class="w-6 h-6 rounded-md bg-orange-100/90 text-brand-terracotta text-xs font-bold flex items-center justify-center">B</span>
          <h3 class="text-sm font-bold text-gray-900">Informasi Obat</h3>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5" for="bentukSediaan">
              Bentuk Sediaan <span class="text-red-500 font-semibold">*</span>
            </label>
            <div class="relative">
              <select class="form-input-custom w-full text-xs font-medium text-gray-800 border-gray-300 rounded-lg px-3.5 py-2.5 appearance-none focus:border-brand-terracotta focus:ring-brand-terracotta pr-10 cursor-pointer" id="bentukSediaan">
                <option selected="" value="Sirup">Sirup</option>
                <option value="Tablet">Tablet</option>
                <option value="Kapsul">Kapsul</option>
                <option value="Salep / Krim">Salep / Krim</option>
                <option value="Injeksi">Injeksi</option>
                <option value="Tetes / Drop">Tetes / Drop</option>
              </select>
              <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                <i class="fa-solid fa-chevron-down text-[10px]"></i>
              </span>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5" for="kandungan">
              Kandungan <span class="text-red-500 font-semibold">*</span>
            </label>
            <input class="form-input-custom w-full text-xs font-medium text-gray-800 border-gray-300 rounded-lg px-3.5 py-2.5 focus:border-brand-terracotta focus:ring-brand-terracotta" id="kandungan" required="" type="text" value="Paracetamol"/>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5" for="kekuatanObat">
              Kekuatan Obat <span class="text-red-500 font-semibold">*</span>
            </label>
            <input class="form-input-custom w-full text-xs font-medium text-gray-800 border-gray-300 rounded-lg px-3.5 py-2.5 focus:border-brand-terracotta focus:ring-brand-terracotta" id="kekuatanObat" required="" type="text" value="100mg / ml"/>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5" for="satuanDasar">
              Satuan Dasar <span class="text-red-500 font-semibold">*</span>
            </label>
            <div class="relative">
              <select class="form-input-custom w-full text-xs font-medium text-gray-800 border-gray-300 rounded-lg px-3.5 py-2.5 appearance-none focus:border-brand-terracotta focus:ring-brand-terracotta pr-10 cursor-pointer" id="satuanDasar">
                <option selected="" value="Botol">Botol</option>
                <option value="Strip">Strip</option>
                <option value="Box">Box</option>
                <option value="Tablet">Tablet</option>
                <option value="Pcs">Pcs</option>
                <option value="Ampul">Ampul</option>
              </select>
              <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                <i class="fa-solid fa-chevron-down text-[10px]"></i>
              </span>
            </div>
          </div>
        </div>
      </section>

      <!-- SECTION C: PENGELOLAAN PERSEDIAAN -->
      <section data-purpose="form-section-c">
        <div class="flex items-center gap-2.5 mb-5">
          <span class="w-6 h-6 rounded-md bg-orange-100/90 text-brand-terracotta text-xs font-bold flex items-center justify-center">C</span>
          <h3 class="text-sm font-bold text-gray-900">Pengelolaan Persediaan</h3>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5" for="stokMinimum">
              Stok Minimum <span class="text-red-500 font-semibold">*</span>
            </label>
            <input class="form-input-custom w-full text-xs font-medium text-gray-800 border-gray-300 rounded-lg px-3.5 py-2.5 focus:border-brand-terracotta focus:ring-brand-terracotta" id="stokMinimum" min="0" required="" type="number" value="15"/>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5">
              Status Obat <span class="text-red-500 font-semibold">*</span>
            </label>
            <div class="grid grid-cols-2 gap-3" data-purpose="status-radio-group">
              <label class="flex items-center gap-2.5 px-4 py-2.5 border-2 border-brand-terracotta bg-[#FFF3F0] rounded-xl cursor-pointer transition select-none" id="labelStatusAktif">
                <input checked="" class="text-brand-terracotta focus:ring-brand-terracotta h-4 w-4 cursor-pointer" name="statusObat" onchange="handleStatusChange('Aktif')" type="radio" value="Aktif"/>
                <span class="text-xs font-bold text-brand-terracotta flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-emerald-600 inline-block"></span>
                  Aktif
                </span>
              </label>
              <label class="flex items-center gap-2.5 px-4 py-2.5 border border-gray-300 bg-white rounded-xl cursor-pointer hover:border-gray-400 transition select-none" id="labelStatusNonaktif">
                <input class="text-brand-terracotta focus:ring-brand-terracotta h-4 w-4 cursor-pointer" name="statusObat" onchange="handleStatusChange('Nonaktif')" type="radio" value="Nonaktif"/>
                <span class="text-xs font-semibold text-gray-700 flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-gray-400 inline-block"></span>
                  Nonaktif
                </span>
              </label>
            </div>
          </div>
        </div>
      </section>

      <!-- FORM ACTIONS -->
      <div class="pt-6 border-t border-gray-100 flex items-center justify-end gap-3" data-purpose="form-actions">
        <button class="px-6 py-2.5 text-xs font-bold text-gray-700 bg-white hover:bg-gray-50 border border-gray-300 rounded-xl transition shadow-2xs" onclick="resetOrCancel()" type="button">
          Batal
        </button>
        <button class="inline-flex items-center gap-2 px-6 py-2.5 text-xs font-bold text-white bg-brand-terracotta hover:bg-brand-terracotta-hover active:scale-95 rounded-xl shadow-sm transition" type="submit">
          <i class="fa-regular fa-floppy-disk text-sm"></i>
          <span>Simpan Obat</span>
        </button>
      </div>
    </form>
  </div>
</main>

<!-- ToastNotification -->
<div class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 ease-out bg-gray-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-xs" id="toastNotification">
  <div class="w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs" id="toastIcon">
    <i class="fa-solid fa-check"></i>
  </div>
  <div>
    <p class="font-bold text-white" id="toastTitle">Sukses</p>
    <p class="text-gray-300 text-[11px]" id="toastMessage">Data obat baru berhasil disimpan ke sistem.</p>
  </div>
</div>

<!-- InteractionScripts -->
<script data-purpose="form-interactions">
  function handleStatusChange(selected) {
    const labelAktif = document.getElementById('labelStatusAktif');
    const labelNonaktif = document.getElementById('labelStatusNonaktif');

    if (selected === 'Aktif') {
      labelAktif.className = 'flex items-center gap-2.5 px-4 py-2.5 border-2 border-brand-terracotta bg-[#FFF3F0] rounded-xl cursor-pointer transition select-none';
      labelAktif.querySelector('span').className = 'text-xs font-bold text-brand-terracotta flex items-center gap-1.5';
      
      labelNonaktif.className = 'flex items-center gap-2.5 px-4 py-2.5 border border-gray-300 bg-white rounded-xl cursor-pointer hover:border-gray-400 transition select-none';
      labelNonaktif.querySelector('span').className = 'text-xs font-semibold text-gray-700 flex items-center gap-1.5';
    } else {
      labelNonaktif.className = 'flex items-center gap-2.5 px-4 py-2.5 border-2 border-brand-terracotta bg-[#FFF3F0] rounded-xl cursor-pointer transition select-none';
      labelNonaktif.querySelector('span').className = 'text-xs font-bold text-brand-terracotta flex items-center gap-1.5';
      
      labelAktif.className = 'flex items-center gap-2.5 px-4 py-2.5 border border-gray-300 bg-white rounded-xl cursor-pointer hover:border-gray-400 transition select-none';
      labelAktif.querySelector('span').className = 'text-xs font-semibold text-gray-700 flex items-center gap-1.5';
    }
  }

  function generateRandomCode() {
    const prefixes = ['MED-PCT', 'MED-AMX', 'MED-IBU', 'MED-CTM'];
    const randomPrefix = prefixes[Math.floor(Math.random() * prefixes.length)];
    const randomNumber = String(Math.floor(Math.random() * 90) + 10);
    const generated = `${randomPrefix}-${randomNumber}`;
    
    const input = document.getElementById('kodeObat');
    input.value = generated;
    
    showToast('Kode Dibuat', `Kode obat otomatis diperbarui: ${generated}`, 'info');
  }

  function submitForm() {
    const namaObat = document.getElementById('namaObat').value;
    showToast('Berhasil Disimpan', `Obat "${namaObat}" telah tersimpan ke database SIM Farmasi.`, 'success');
  }

  function resetOrCancel() {
    showToast('Dibatalkan', 'Perubahan formulir dibatalkan.', 'warning');
  }

  function showToast(title, message, type = 'success') {
    const toast = document.getElementById('toastNotification');
    const toastTitle = document.getElementById('toastTitle');
    const toastMessage = document.getElementById('toastMessage');
    const toastIcon = document.getElementById('toastIcon');

    toastTitle.innerText = title;
    toastMessage.innerText = message;

    if (type === 'success') {
      toastIcon.className = 'w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs';
      toastIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
    } else if (type === 'info') {
      toastIcon.className = 'w-6 h-6 rounded-full bg-blue-500 text-white flex items-center justify-center text-xs';
      toastIcon.innerHTML = '<i class="fa-solid fa-info"></i>';
    } else {
      toastIcon.className = 'w-6 h-6 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs';
      toastIcon.innerHTML = '<i class="fa-solid fa-rotate-left"></i>';
    }

    toast.classList.remove('translate-y-24', 'opacity-0');
    toast.classList.add('translate-y-0', 'opacity-100');

    setTimeout(() => {
      toast.classList.remove('translate-y-0', 'opacity-100');
      toast.classList.add('translate-y-24', 'opacity-0');
    }, 3500);
  }
</script>
{{ end }}
