{{ define "partials.header.html" }}
<header class="bg-white/80 backdrop-blur border-b border-[#EAE2D8] sticky top-0 z-20 px-6 py-3 flex flex-wrap items-center justify-between gap-4" data-purpose="top-header">
  <div class="flex items-center gap-2 text-xs font-semibold text-slate-400">
    <a class="hover:text-slate-600 transition" href="#">Beranda</a>
    <span>›</span>
    <span class="text-slate-900 font-bold text-sm">Dashboard</span>
  </div>
  <div class="flex items-center flex-wrap gap-3">
    <div class="relative w-64 md:w-80">
      <input class="w-full text-xs pl-8 pr-12 py-2 rounded-lg bg-[#F8F6F2] border border-[#E5DCD2] focus:ring-1 focus:ring-[#A34839] focus:border-[#A34839] text-slate-700 placeholder-slate-400" placeholder="Cari obat, nomor batch, faktur..." type="text"/>
      <svg class="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <span class="absolute right-2 top-2 text-[10px] text-slate-400 bg-white px-1.5 py-0.5 rounded border border-[#E2D8CC] font-mono">⌘K</span>
    </div>
    <div class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 bg-[#FAF6F0] border border-[#E7DDD0] rounded-lg text-xs font-medium text-slate-700">
      <svg class="w-3.5 h-3.5 text-[#964334]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
      <span>Kamis, 05 November 2026</span>
    </div>
    <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-lg text-xs font-semibold">
      <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
      <span>Sistem Sinkron Aktif</span>
    </div>
    <div class="flex items-center gap-2 pl-2 border-l border-slate-200">
      <div class="w-8 h-8 rounded-full bg-[#964334] text-white flex items-center justify-center font-bold text-xs ring-2 ring-white">A</div>
      <div class="hidden md:block leading-tight text-left">
        <p class="text-xs font-bold text-slate-900">Administrator</p>
        <p class="text-[10px] text-slate-500">Admin Farmasi</p>
      </div>
    </div>
  </div>
</header>
{{ end }}
