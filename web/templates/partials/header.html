{{define "header"}}
<header class="topbar">
    <div class="topbar-left">
        <button class="mobile-menu-button" type="button" data-sidebar-toggle aria-label="Buka navigasi" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="breadcrumb"><span>Apotek Sumber Waras</span><span class="breadcrumb-separator">/</span><strong>{{.Title}}</strong></div>
    </div>
    <div class="topbar-right">
        <div class="topbar-date"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7.5 3v4M16.5 3v4M3.5 9.5h17"/></svg>{{.CurrentDate}}</div>
        <button class="topbar-icon notification-icon" type="button" aria-label="Notifikasi" data-toast="Belum ada notifikasi baru."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-2.5 7-2.5 8.5h17C20.5 16 18 16 18 9ZM10 21h4"/></svg><i></i></button>
        <button class="topbar-icon help-icon" type="button" aria-label="Bantuan" data-toast="Bantuan aplikasi masih dalam tahap pengembangan."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.4 2.4 0 1 1 4.1 1.7c-1 .9-1.8 1.2-1.8 2.8M12 17h.01"/></svg></button>
        <div class="user-profile">
            <span class="avatar" aria-hidden="true">{{.AvatarText}}</span>
            <span class="user-meta"><strong>{{.User.Nama}}</strong><small>{{.RoleLabel}}</small></span>
            <span class="role-badge">{{.RoleLabel}}</span>
        </div>
    </div>
</header>
{{end}}
