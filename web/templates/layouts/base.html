<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{{block "title" .}}Dashboard Apotek Sumber Waras{{end}}</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
              colors: {
                brand: { 50: '#FDF8F6', 100: '#F7EBE8', 200: '#EED3CD', 400: '#D97E6E', 500: '#C15C4B', 600: '#A34839', 700: '#8A3B2E', 800: '#6E2E23' },
                cream: { 50: '#FCFAF6', 100: '#F9F5EE', 200: '#F1E9DC' }
              }
            }
          }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #d4c5b9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #bfaea0; }
    </style>
</head>
<body class="bg-[#F8F6F2] text-slate-800 font-sans antialiased min-h-screen flex flex-col lg:flex-row">

    <!-- Memanggil Sidebar Partial -->
    {{template "partials/sidebar.html" .}}

    <!-- Konten Utama Dinamis -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <!-- Top Header Bar -->
        <header class="bg-white/80 backdrop-blur border-b border-[#EAE2D8] sticky top-0 z-20 px-6 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-400">
                <a class="hover:text-slate-600 transition" href="#">Beranda</a>
                <span>›</span>
                <span class="text-slate-900 font-bold text-sm">Dashboard</span>
            </div>
            <div class="flex items-center flex-wrap gap-3">
                <div class="relative w-64 md:w-80">
                    <input class="w-full text-xs pl-8 pr-12 py-2 rounded-lg bg-[#F8F6F2] border border-[#E5DCD2] focus:ring-1 focus:ring-[#A34839] text-slate-700 placeholder-slate-400" placeholder="Cari obat, nomor batch, faktur..." type="text"/>
                    <svg class="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <span class="absolute right-2 top-2 text-[10px] text-slate-400 bg-white px-1.5 py-0.5 rounded border font-mono">⌘K</span>
                </div>
                <!-- Profil Pengguna -->
                <div class="flex items-center gap-2 pl-2">
                    <div class="w-8 h-8 rounded-full bg-[#964334] text-white flex items-center justify-center font-bold text-xs">A</div>
                    <div class="hidden md:block leading-tight text-left">
                        <p class="text-xs font-bold text-slate-900">Administrator</p>
                        <p class="text-[10px] text-slate-500">Admin Farmasi</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Inject Halaman Konten (Dashboard) -->
        {{template "content" .}}
    </main>

</body>
</html>
