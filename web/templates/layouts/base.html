<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{{block "title" .}}Dashboard Apotek Sumber Waras{{end}}</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
              colors: {
                brand: { 50: '#FDF8F6', 100: '#F7EBE8', 200: '#EED3CD', 400: '#D97E6E', 500: '#C15C4B', 600: '#A34839', 700: '#8A3B2E', 800: '#6E2E23' },
                cream: { 50: '#FCFAF6', 100: '#F9F5EE', 200: '#F1E9DC' }
              }
            }
          }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #d4c5b9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #bfaea0; }
    </style>
</head>
<body class="bg-[#F8F6F2] text-slate-800 font-sans antialiased min-h-screen flex flex-col lg:flex-row">

    <!-- Memanggil Sidebar Partial -->
    {{template "partials/sidebar.html" .}}

    <!-- Konten Utama Dinamis -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <!-- Top Header Bar -->
        <header class="bg-white/80 backdrop-blur border-b border-[#EAE2D8] sticky top-0 z-20 px-6 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-400">
                <a class="hover:text-slate-600 transition" href="/dashboard">Beranda</a>
                <span>›</span>
                <span class="text-slate-900 font-bold text-sm">Dashboard</span>
            </div>
            <div class="flex items-center flex-wrap gap-3">
                <div class="relative w-64 md:w-80">
                    <input class="w-full text-xs pl-8 pr-12 py-2 rounded-lg bg-[#F8F6F2] border border-[#E5DCD2] focus:ring-1 focus:ring-[#A34839] text-slate-700 placeholder-slate-400" placeholder="Cari obat, nomor batch, faktur..." type="text"/>
                    <svg class="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <span class="absolute right-2 top-2 text-[10px] text-slate-400 bg-white px-1.5 py-0.5 rounded border font-mono">⌘K</span>
                </div>
                
                <!-- Wrapper Profil & Dropdown Popover -->
                <div class="relative" id="profilDropdownWrapper">
                    <button id="btnToggleProfilDropdown" type="button" class="flex items-center gap-2 pl-2 pr-2.5 py-1.5 rounded-xl hover:bg-[#F8F6F2] border border-transparent hover:border-[#EAE2D8] transition cursor-pointer">
                        <div id="headerAvatarInisial" class="w-8 h-8 rounded-full bg-[#964334] text-white flex items-center justify-center font-bold text-xs">B</div>
                        <div class="hidden md:block leading-tight text-left">
                            <p id="headerNamaUser" class="text-xs font-bold text-slate-900">Budi Santoso</p>
                            <p id="headerRoleUser" class="text-[10px] text-slate-500">OWNER</p>
                        </div>
                        <svg class="w-3.5 h-3.5 text-slate-400 hidden md:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                    </button>

                    <!-- Menu Dropdown Popover (Tanpa Pengaturan) -->
                    <div id="menuProfilDropdown" class="hidden absolute right-0 mt-2 w-56 rounded-2xl bg-white border border-[#EAE2D8] shadow-xl py-1.5 z-50">
                        <!-- Nama Pengguna -->
                        <div class="px-4 py-2.5 border-b border-slate-100">
                            <p id="dropdownNamaUser" class="text-xs font-extrabold text-slate-900">Budi Santoso</p>
                            <p id="dropdownStatusRole" class="text-[10px] font-bold tracking-wider uppercase text-[#964334] mt-0.5">Role: OWNER</p>
                        </div>

                        <!-- Menu Profil (Mengarah ke Halaman Penuh /profil) -->
                        <!-- Menu Profil -->
                    <div class="py-1 border-b border-slate-100 px-1.5">
                        <a href="/profil" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-[#FDF8F6] hover:text-[#964334] transition">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <span>Profil</span>
                        </a>
                    </div>

                        <!-- Tombol Keluar -->
                        <div class="pt-1 px-1.5">
                            <a href="/login" onclick="localStorage.removeItem('apotek_active_role')" class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-bold text-rose-600 hover:bg-rose-50 transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                                <span>Keluar</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Inject Halaman Konten -->
        {{template "content" .}}
    </main>

    <script>
        // Data dummy sementara sebelum disambungkan ke tabel users oleh Back-end
        const dummyUser = {
            nama: 'Budi Santoso',
            role: 'OWNER'
        };

        const wrapperProfil = document.getElementById('profilDropdownWrapper');
        const btnToggleDropdown = document.getElementById('btnToggleProfilDropdown');
        const menuDropdown = document.getElementById('menuProfilDropdown');

        btnToggleDropdown.addEventListener('click', (e) => {
            e.stopPropagation();
            menuDropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!wrapperProfil.contains(e.target)) {
                menuDropdown.classList.add('hidden');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                menuDropdown.classList.add('hidden');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const inisial = dummyUser.nama.charAt(0).toUpperCase();
            document.getElementById('headerAvatarInisial').innerText = inisial;
            document.getElementById('headerNamaUser').innerText = dummyUser.nama;
            document.getElementById('headerRoleUser').innerText = dummyUser.role;
            document.getElementById('dropdownNamaUser').innerText = dummyUser.nama;
            document.getElementById('dropdownStatusRole').innerText = `Role: ${dummyUser.role}`;
        });
    </script>
</body>
</html>
